<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TravelBlooom | Home</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <nav>
    <a class="nav-brand" href="index.html"><i class="ti ti-plane" aria-hidden="true"></i>TravelBlooom</a>
    <div class="nav-links">
      <a class="nav-link active" href="home.html">Home</a>
      <a class="nav-link" href="about.html">About Us</a>
      <a class="nav-link" href="contact.html">Contact Us</a>
    </div>
    <div class="nav-search">
      <input type="text" id="searchInput" placeholder="Enter a destination or keyword" onkeydown="if(event.key==='Enter')doSearch()">
      <button class="btn-search" onclick="doSearch()"><i class="ti ti-search" aria-hidden="true"></i> Search</button>
      <button class="btn-clear" onclick="clearSearch()">Clear</button>
    </div>
  </nav>

  <div id="home" class="page active">
    <div id="heroSection" class="hero">
      <div class="hero-city-bg"></div>
      <div class="hero-social">
        <a href="#" aria-label="Twitter"><i class="ti ti-brand-twitter" aria-hidden="true"></i></a>
        <a href="#" aria-label="Facebook"><i class="ti ti-brand-facebook" aria-hidden="true"></i></a>
        <a href="#" aria-label="Instagram"><i class="ti ti-brand-instagram" aria-hidden="true"></i></a>
        <a href="#" aria-label="YouTube"><i class="ti ti-brand-youtube" aria-hidden="true"></i></a>
      </div>
      <div class="hero-content">
        <div class="hero-title">Explore<br>Dream<br>Destination</div>
        <p class="hero-sub">It encourages exploration of unfamiliar territories, embracing diverse cultures and landscapes, while pursuing the desired destination that captivates the heart and ignites a sense of wonder.</p>
        <button class="btn-book" onclick="document.getElementById('searchInput').focus()">Book Now</button>
      </div>
    </div>
    <div id="searchResults" class="search-results" style="display:none"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
