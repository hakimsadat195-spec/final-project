<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TravelBlooom | Contact Us</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <nav>
    <a class="nav-brand" href="index.html"><i class="ti ti-plane" aria-hidden="true"></i>TravelBlooom</a>
    <div class="nav-links">
      <a class="nav-link" href="home.html">Home</a>
      <a class="nav-link" href="about.html">About Us</a>
      <a class="nav-link active" href="contact.html">Contact Us</a>
    </div>
  </nav>

  <div id="contact" class="page active">
    <div class="contact-page">
      <h1>Contact us</h1>
      <p class="sub">Have a question or feedback? We'd love to hear from you. Fill in the form below and our team will get back to you within 24 hours.</p>
      <div id="contactForm">
        <div class="form-group"><label for="cName">Your name</label><input type="text" id="cName" placeholder="Jane Smith"></div>
        <div class="form-group"><label for="cEmail">Email address</label><input type="email" id="cEmail" placeholder="jane@example.com"></div>
        <div class="form-group"><label for="cTopic">Topic</label><select id="cTopic"><option value="">Select a topic…</option><option>Destination recommendation</option><option>Booking assistance</option><option>Account issue</option><option>Partnership inquiry</option><option>General feedback</option></select></div>
        <div class="form-group"><label for="cMsg">Message</label><textarea id="cMsg" placeholder="Tell us how we can help…"></textarea></div>
        <button class="btn-submit" onclick="submitContact()">Send message</button>
      </div>
      <div class="success-msg" id="successMsg">
        <i class="ti ti-circle-check" aria-hidden="true"></i>
        <h3>Message sent!</h3>
        <p>Thanks for reaching out. A member of our team will get back to you within 24 hours.</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
